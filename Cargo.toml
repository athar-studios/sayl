[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/http",
    "crates/app",
    "crates/cli",
    "crates/media",
    "crates/torrent",
    "crates/plugin-host",
    "crates/test-http",
    "crates/bench",
    "crates/bridge",
    "apps/desktop/src-tauri",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
