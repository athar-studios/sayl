<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>SAYL Download Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 14px;
      user-select: none;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .header img {
      width: 28px;
      height: 28px;
    }
    .header-titles {
      flex: 1;
    }
    .title-main {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .status-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.pending {
      background: var(--yellow);
    }
    .dot.success {
      background: var(--green);
    }
    .dot.error {
      background: var(--red);
    }
    .status-text {
      font-size: 13px;
      font-weight: 600;
      flex: 1;
    }
    .details {
      margin-top: 6px;
      margin-bottom: 8px;
      font-size: 11px;
      color: var(--text-muted);
      background: #090d16;
      border-radius: 4px;
      padding: 6px 8px;
      direction: ltr;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
    }
    .hidden {
      display: none !important;
    }
    .btn {
      width: 100%;
      padding: 7px 10px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .btn-outline:hover {
      background: var(--accent);
      color: #0f172a;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .switch-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .switch-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .field-row {
      margin-bottom: 10px;
    }
    .field-row label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .field-row input[type="number"],
    .field-row textarea {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 11px;
      font-family: inherit;
    }
    .field-row input[type="number"]:focus,
    .field-row textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .field-row textarea {
      resize: vertical;
      direction: ltr;
    }
    .saved-notice {
      font-size: 11px;
      color: var(--green);
      text-align: center;
      margin-top: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/32x32.png" alt="SAYL Logo">
    <div class="header-titles">
      <div id="title-main" class="title-main">سيل — مدير التنزيلات</div>
    </div>
  </div>

  <div class="card status-card">
    <div class="status-header">
      <div id="status-dot" class="dot pending"></div>
      <div id="status-text" class="status-text">...</div>
    </div>
    <div id="status-details" class="details hidden"></div>
    <button id="test-btn" class="btn btn-outline" type="button">اختبار</button>
  </div>

  <div class="card settings-card">
    <div id="settings-title" class="section-title">الإعدادات</div>
    <label class="switch-row">
      <input type="checkbox" id="setting-enabled" checked>
      <span id="lbl-enabled">تفعيل الاعتراض التلقائي</span>
    </label>

    <div class="field-row">
      <label for="setting-min-size" id="lbl-min-size">الحد الأدنى للحجم (ميجابايت)</label>
      <input type="number" id="setting-min-size" min="0" step="1" value="1">
    </div>

    <div class="field-row">
      <label for="setting-extensions" id="lbl-extensions">صيغ الملفات المعترضة</label>
      <textarea id="setting-extensions" rows="3" spellcheck="false"></textarea>
    </div>

    <div id="saved-notice" class="saved-notice hidden">تم الحفظ</div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
