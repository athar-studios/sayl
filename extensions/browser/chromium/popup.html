<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>SAYL Download Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    .header img {
      width: 28px;
      height: 28px;
    }
    .header-titles {
      flex: 1;
    }
    .title-ar {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .title-en {
      font-size: 11px;
      color: var(--text-muted);
      direction: ltr;
      text-align: right;
    }
    .status-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .status-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.pending {
      background: var(--yellow);
    }
    .dot.success {
      background: var(--green);
    }
    .dot.error {
      background: var(--red);
    }
    .status-ar {
      font-size: 13px;
      font-weight: 600;
    }
    .status-en {
      font-size: 11px;
      color: var(--text-muted);
      direction: ltr;
      text-align: left;
      padding-inline-start: 18px;
    }
    .details {
      margin-top: 8px;
      font-size: 10px;
      color: var(--text-muted);
      background: #090d16;
      border-radius: 4px;
      padding: 6px 8px;
      direction: ltr;
      word-break: break-all;
    }
    .hidden {
      display: none;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/32x32.png" alt="SAYL Logo">
    <div class="header-titles">
      <div class="title-ar">سيل — مدير التنزيلات</div>
      <div class="title-en">SAYL Download Manager</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-header">
      <div id="status-dot" class="dot pending"></div>
      <div id="status-ar" class="status-ar">جاري فحص الاتصال...</div>
    </div>
    <div id="status-en" class="status-en">Checking connection...</div>
    <div id="host-details" class="details hidden"></div>
  </div>

  <button id="recheck-btn" class="btn">إعادة الفحص / Recheck</button>

  <script src="popup.js"></script>
</body>
</html>
