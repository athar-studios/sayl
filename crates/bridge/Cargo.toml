[package]
name = "sayl-bridge"
version = "0.1.0"
edition = "2021"
description = "Browser native-messaging protocol, validation, and host loop for SAYL"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sayl-http = { path = "../http" }
sayl-core = { path = "../core" }
sayl-app = { path = "../app" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
sayl-test-http = { path = "../test-http" }
tempfile = "3"
