[package]
name = "sayl-test-http"
version = "0.1.0"
edition = "2021"
description = "Deterministic HTTP fixture server and failure mode simulator for SAYL"

[dependencies]
bytes = "1.7"
tracing = { version = "0.1", default-features = false }
uuid = { version = "=1.9.0", features = ["v4", "v7"] }
tokio = { version = "1.40", default-features = false, features = ["sync", "time", "io-util", "rt", "rt-multi-thread", "net", "macros"] }

# Optional dependencies when toolchain linker is available
hyper = { version = "0.14", optional = true }
serde = { version = "1.0", optional = true }
chrono = { version = "0.4", optional = true }

[features]
default = []
full = ["hyper", "serde", "chrono"]
serde = ["dep:serde"]
chrono = ["dep:chrono"]
hyper = ["dep:hyper"]
