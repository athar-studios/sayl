[package]
name = "sayl-app"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[dependencies]
sayl-core = { path = "../core", features = ["serde"] }
sayl-http = { path = "../http" }
sayl-storage = { path = "../storage" }
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
tokio = { version = "1.40", features = ["sync", "time", "io-util", "rt", "rt-multi-thread", "net", "macros", "fs"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1.7"
thiserror = "1.0"
url = { version = "2.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "=1.9.0", features = ["v7", "serde"] }
tracing = "0.1"

[dev-dependencies]
sayl-test-http = { path = "../test-http" }
tempfile = "3.10"
tokio = { version = "1.40", features = ["test-util"] }
