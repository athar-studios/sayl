[package]
name = "sayl-http"
version = "0.1.0"
edition = "2021"

[lib]
# Documented examples are kept in the source but not executed as doctests:
# under the x86_64-pc-windows-gnu target this crate's doctest binary links
# native-tls/SChannel and crashes at load (0xc0000005) before any example runs.
# The same assertions are covered by the #[cfg(test)] unit tests in each module.
doctest = false

[dependencies]
sayl-core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
tokio = { version = "1.40", features = ["sync", "time", "io-util", "rt", "rt-multi-thread", "net", "macros", "fs"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1.7"
thiserror = "1.0"
url = { version = "2.5", features = ["serde"] }
percent-encoding = "2.3"
unicode-normalization = "0.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"

[dev-dependencies]
sayl-test-http = { path = "../test-http" }
serde_json = "1.0"
