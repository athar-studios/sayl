[package]
name = "sayl-bench"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
sayl-http = { path = "../http" }
sayl-test-http = { path = "../test-http" }
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
tokio = { version = "1.40", features = ["sync", "time", "io-util", "rt", "rt-multi-thread", "net", "macros", "fs"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.7"
