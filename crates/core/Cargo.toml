[package]
name = "sayl-core"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
uuid = { version = "=1.9.0", features = ["v7"] }
getrandom = "=0.2.15"
tokio = { version = "1.40", default-features = false, features = ["sync", "time"] }
bytes = "1.7"
tracing = { version = "0.1", default-features = false }

# Optional dependencies for serialization and error derives when toolchain linker is available
serde = { version = "1.0", optional = true }
chrono = { version = "0.4", optional = true }
thiserror = { version = "1.0", optional = true }

[features]
default = []
full = ["serde", "chrono", "thiserror"]

[dev-dependencies]
sayl-test-http = { path = "../test-http" }

