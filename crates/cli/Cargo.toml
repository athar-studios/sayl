[package]
name = "sayl-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sayl"
path = "src/main.rs"
test = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
sayl-core = { path = "../core", features = ["serde"] }
sayl-storage = { path = "../storage" }
sayl-http = { path = "../http" }
sayl-app = { path = "../app" }

[dev-dependencies]
sayl-test-http = { path = "../test-http" }
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3"
reqwest = "0.12"
