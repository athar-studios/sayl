<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- SAYL Open Graph Image - 1200x630 -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Background pattern -->
  <g opacity="0.05">
    <rect x="0" y="0" width="1200" height="630" fill="url(#grid)"/>
  </g>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#fff" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Main diamond logo -->
  <g transform="translate(600, 280)">
    <path d="M0 -120L-100 -40v80l100 80 100-80v-80L0 -120z" fill="#2563eb"/>
    <path d="M0 -120L-100 -40v80l100 80 100-80v-80L0 -120z" fill="#1d4ed8" opacity="0.3"/>
    <circle r="30" fill="#fff"/>
    <path d="M0 -50v50M-25 0l25 25 25-25" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Arabic', sans-serif" font-size="64" font-weight="800" fill="#fff" letter-spacing="-1">سيل <tspan fill="#3b82f6">SAYL</tspan></text>
  
  <!-- Subtitle -->
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Arabic', sans-serif" font-size="28" font-weight="400" fill="#94a3b8">مدير تحميل مستقل لـ Windows</text>
  
  <!-- Tagline -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Arabic', sans-serif" font-size="20" font-weight="500" fill="#64748b">لا تتبع • لا تحليلات • مفتوح المصدر</text>
</svg>